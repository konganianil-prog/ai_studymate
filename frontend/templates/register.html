{% extends "base.html" %}

{% block title %}Create Account — AI STUDY MATE{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="study-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Join AI STUDY MATE</h3>
          <p class="text-muted small">Begin your AI-powered learning journey</p>
        </div>

        <div id="registerAlert" class="alert alert-danger d-none animate-fade-in" role="alert"></div>

        <form id="registerForm">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0" id="fullName" name="full_name" placeholder="e.g. Rahul Sharma" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-at"></i></span>
              <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. rahul_s" required minlength="3">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="rahul@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
            </div>
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-shield-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="confirmPassword" name="confirm_password" placeholder="Re-type password" required minlength="6">
            </div>
          </div>

          <div class="d-grid mb-4">
            <button type="submit" id="registerBtn" class="btn btn-primary-gradient py-2 fs-6">
              <span id="registerBtnSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status"></span>
              <span>Create Account</span>
            </button>
          </div>

          <div class="text-center small text-muted">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('registerAlert');
  const btn = document.getElementById('registerBtn');
  const spinner = document.getElementById('registerBtnSpinner');

  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('confirmPassword').value;

  if (p1 !== p2) {
    alertBox.textContent = "Passwords do not match!";
    alertBox.classList.remove('d-none');
    return;
  }

  alertBox.classList.add('d-none');
  btn.disabled = true;
  spinner.classList.remove('d-none');

  const payload = {
    full_name: document.getElementById('fullName').value.trim(),
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: p1,
    confirm_password: p2
  };

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = data.data.redirect || '/dashboard';
    } else {
      alertBox.textContent = data.message || 'Registration failed. Please try again.';
      alertBox.classList.remove('d-none');
      btn.disabled = false;
      spinner.classList.add('d-none');
    }
  } catch (err) {
    alertBox.textContent = 'Server connection error. Please try again.';
    alertBox.classList.remove('d-none');
    btn.disabled = false;
    spinner.classList.add('d-none');
  }
});
</script>
{% endblock %}
