{% extends "base.html" %}

{% block title %}Sign In — AI STUDY MATE{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="study-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in to resume your learning session</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none animate-fade-in" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. student or student@example.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label mb-0">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-grid mb-4">
            <button type="submit" id="loginBtn" class="btn btn-primary-gradient py-2 fs-6">
              <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status"></span>
              <span>Sign In</span>
            </button>
          </div>

          <div class="text-center small text-muted">
            Don't have an account yet? 
            <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary">Create an account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('loginAlert');
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('loginBtnSpinner');

  alertBox.classList.add('d-none');
  btn.disabled = true;
  spinner.classList.remove('d-none');

  const payload = {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value
  };

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = data.data.redirect || '/dashboard';
    } else {
      alertBox.textContent = data.message || 'Login failed. Please verify credentials.';
      alertBox.classList.remove('d-none');
      btn.disabled = false;
      spinner.classList.add('d-none');
    }
  } catch (err) {
    alertBox.textContent = 'Server connection error. Please try again.';
    alertBox.classList.remove('d-none');
    btn.disabled = false;
    spinner.classList.add('d-none');
  }
});
</script>
{% endblock %}
